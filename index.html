<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AD5 Reasoning Trainer</title>
<meta name="description" content="Practise the EPSO AD5 verbal, numerical and abstract reasoning tests: coach mode, practice and timed exam simulation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231d3fa6%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-family=%22Arial%22 font-size=%2214%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22white%22%3EAD5%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<main id="app" class="app"><p style="padding:24px 0">Loading the trainer…</p></main>
<noscript><p>This trainer needs JavaScript enabled.</p></noscript>
<!-- build:inline -->
<script>
  // Always load the newest files. version.js gets a new URL on every visit, so no browser or
  // GitHub Pages cache can serve an old copy of it; its version code (updated by `npm run build`)
  // is then added to every other file, so an update never mixes old and new files.
  window.EPSO_FILES = ["questions/registry.js", "questions/manifest.js", "questions/exams.js", "assets/core.js", "assets/lessons.js", "assets/render.js", "assets/app.js"];
  (function () {
    function load(src, next) {
      var el = document.createElement("script");
      el.src = src;
      el.onload = next;
      el.onerror = next;
      document.body.appendChild(el);
    }
    load("version.js?t=" + Date.now(), function () {
      var v = window.EPSO_VERSION ? "?v=" + encodeURIComponent(window.EPSO_VERSION) : "";
      var css = document.querySelector('link[href="assets/styles.css"]');
      if (css && v) css.href = "assets/styles.css" + v;
      var files = window.EPSO_FILES.slice();
      (function next() { if (files.length) load(files.shift() + v, next); })();
    });
  })();
</script>
<!-- /build:inline -->
</body>
</html>
