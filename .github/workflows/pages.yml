name: Check and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Validate question bank (schema, difficulty rules, duplicates)
        run: npm run validate
      - name: Unit tests
        run: npm test
      - name: Build single-file app
        run: npm run build
      - name: The committed bundle must be up to date
        run: git diff --exit-code -- dist/ad5-reasoning-trainer.html version.js || (echo "dist/ or version.js is stale. Run 'npm run build' and commit the result." && exit 1)
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests (Chromium and WebKit)
        run: npm run test:e2e
        env:
          BROWSERS: chromium,webkit
      - name: Prepare site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp -r index.html assets questions dist _site/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Only deployments share a concurrency group, so a pull-request run can never cancel a deploy.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
